name: build
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -O -wmo -target arm64-apple-macos12 -o macpip native/*.swift
      - run: ls -lh macpip
      - run: node --check extension/background.js
      - name: native messaging round-trip (malformed request → error reply)
        run: |
          python3 - <<'PY'
          import json, struct, subprocess
          p = subprocess.Popen(["./macpip", "chrome-extension://x/"], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          msg = json.dumps({"action": "open", "url": "file:///etc/passwd"}).encode()
          p.stdin.write(struct.pack("<I", len(msg)) + msg); p.stdin.flush()
          n = struct.unpack("<I", p.stdout.read(4))[0]
          reply = json.loads(p.stdout.read(n)); print(reply)
          assert reply == {"type": "error"}, reply
          p.stdin.close(); assert p.wait(timeout=10) == 0
          PY
