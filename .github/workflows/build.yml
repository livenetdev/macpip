name: build
on:
  push:
    paths-ignore: ['dist/**']
  pull_request:
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: ./build.sh && du -sh build/MacPiP.app && for f in extension/*.js; do node --check $f; done
      - name: end-to-end (Chrome for Testing + extension + app, fullscreen Terminal)
        run: ci/e2e.sh
      - name: package universal .dmg and verify it
        run: |
          DMG=1 ./build.sh
          hdiutil attach -quiet -nobrowse -mountpoint /tmp/m build/MacPiP.dmg
          ls -la /tmp/m
          lipo -archs /tmp/m/MacPiP.app/Contents/MacOS/macpip
          codesign --verify --deep --strict /tmp/m/MacPiP.app && echo "codesign ok"
          plutil -p /tmp/m/MacPiP.app/Contents/Info.plist | grep -E "Version|Identifier"
          hdiutil detach -quiet /tmp/m
          ls -l build/MacPiP.dmg; shasum -a 256 build/MacPiP.dmg
          echo "DMG $(base64 -i build/MacPiP.dmg | tr -d '\n')"
      - uses: actions/upload-artifact@v4
        with: { name: MacPiP-dmg, path: build/MacPiP.dmg }
